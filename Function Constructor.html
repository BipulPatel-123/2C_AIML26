<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Function Constructor </title>
</head>
<body>
  <script>

class Hello {
  constructor(a, b) {
    this.id = a;
    this.name = b;
  }
}

let h1 = new Hello(101, "Bipul");
console.log(h1.id);
let h2 = new Hello(102, "Ravi");
console.log(h2.id);

function Student(id, name, city) {
  this.id = id;
  this.name = name;
  this.city = city; 
}

let s1 = new Student(101, "Bipul", "Ghaziabad");
console.log(s1.id);
let s2 = new Student(102, "Ravi", "Noida");
console.log(s2.id);

  </script>
</body>
</html>
