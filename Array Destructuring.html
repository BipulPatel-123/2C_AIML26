<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Array Destructuring </title>
</head>
<body>
  <script>
// array destructuring is used to unpack values from arrays, or properties from objects, into distinct variables.<br>

let student = ["Bipul Patel", 101, "CSE","B.Tech"];
let [name, rollno, branch, degree] = student;
document.write("Name = " + name + "<br>");
document.write("Roll No = " + rollno + "<br>");
document.write("Branch = " + branch + "<br>");
document.write("Degree = " + degree + "<br>");

  </script>
</body>
</html>
