<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Function in JS </title>
<script>
  function info(){
    let age = parseInt(prompt("Enter your age:"));

    if(age >= 18){
      alert("You are eligible to vote.");
    } 
    
    else {
      alert("You are not eligible to vote.");
    }
  }
  </script>
</head>
<body>
  <h2 style="color: blue; text-align: center;">We check the Eligibility for the Voting </h2>
  <input type="button" value="Check Eligibility" onclick="info()">
</body>
</html>
