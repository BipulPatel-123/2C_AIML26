<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rest Operator</title>
</head>

<body>
// rest operator is used to represent an indefinite number of arguments as an array.<br>
<script>

function sum(...values) {
  let total = 0;

  for (let value of values) {
    total += value;
  }
  document.write("Sum = " + total + "<br>");
}

function subtract(...values) {
  let total = 0;

  for (let value of values) {
    total -= value;
  }
  document.write("Subtract = " + total + "<br>");
}


sum(10, 20);
sum(10, 20, 30);
sum(10, 20, 30, 40);
sum(10, 20, 30, 40, 50);
subtract(10,20,40,50);
subtract(90,70,80,60,10,40);
sum ("Bipul",10,20)
sum 

</script>

</body>
</html>
