<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spread operator </title>
</head>
<body>
  <script>

let data = [10,20,30,40,50];
function sum(...args){
  let sum =0;
  for (let i of args){
    sum = sum + i;
  }
    document.write("Sum of all element in array = " + sum  + "<br>");
}
sum(... data);

  </script>
</body>
</html>
