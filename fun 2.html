<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Eligibility</title>

    <script>
        function info() {
            let age = parseInt(prompt("Enter your age:"));

            if (age >= 18) {
                let c = confirm("Do you want to submit your age?");

                if (c) {
                    alert("Your response is submitted.");
                } else {
                    alert("Your response is not submitted. Thank You!");
                }
            } else {
                alert("You are not eligible to vote.");
            }
        }
    </script>
</head>

<body>
    <input type="button" value="Result" onclick="info()">
</body>
</html>
