<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
function F(fn){
  let FN=fn;
  return FN;
}

function L(ln){
  let LN=ln;
  return LN;
}
function Name(){
  let FirstName=F("Bipul");
  let LastName=L("Patel");
  document.write(FirstName+"              "+LastName);    
}
  </script>
</head>
<body>
  <input type="button" value="Display Name" onclick="Name()">
</body>
</html>
