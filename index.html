<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Program</title>
<script>
  function sum() {
    let a = 5;
    let b = 10;
    let c = a + b;
    document.write("The sum of a and b is: " + c);
  }
</script>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
  }
  input[type="button"] {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    color: rgb(9, 93, 211);
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    color: rgb(185, 246, 99);
  }
</style>
</head>
<body>
  <input type="button" value="Calculate Sum" onclick="sum()">
  <p>
    Hello, World!
  </p>
</body>
</html>
